databaseChangeLog:
  - changeSet:
      id: 1
      author: 123123
      changes:
        - createTable:
            tableName: student
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
              - column:
                  name: age
                  type: integer
  - changeSet:
      id: 2
      author: 123123
      changes:
        - createTable:
            tableName: faculty
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
              - column:
                  name: color
                  type: varchar(255)
  - include:
      file: db/changelog/db.changelog-lesson-three.yaml